<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <dialog id="intro-dialog">
        <p>Hi I'm going to make some sound</p>
        <button id="intro-dialog-close">ok</button>
    </dialog>
    <header>
        <h1>Audio Instrument</h1>
    </header>
    <main>
      
      <section class="prototype">
        <div class="draggable-area">
          <h2>Drag them</h2>

          <div id="block-1" class="creature" draggable="true">1</div>
          <div id="block-2" class="creature" draggable="true">2</div>
          <div id="block-3" class="creature" draggable="true">3</div>
        </div>   
         

        <div id= "target" class="drop-zone">
          <p>Drop elements here</p>
        </div>
      </section>
    </main>

</body>
</html>
